# Path-based rules for .github/workflows/pr-risk.yml (actions/labeler).

"risk:dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - ".npmrc"
          - ".nvmrc"

"risk:agents":
  - changed-files:
      - any-glob-to-any-file:
          - "agents/**"
          - "skills/**"
          - "CLAUDE.core.md"
          - "CLAUDE.core.adopted.md"

"risk:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
